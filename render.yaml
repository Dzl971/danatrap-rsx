services:
  - type: web
    name: danatrap-rsx-site
    runtime: static
    buildCommand: node frontend/build-render-config.mjs
    staticPublishPath: ./frontend
    autoDeployTrigger: commit
    envVars:
      - key: DRSX_DEMO_MODE
        value: "false"
      - key: DRSX_SUPABASE_URL
        sync: false
      - key: DRSX_SUPABASE_ANON_KEY
        sync: false
      - key: DRSX_ADMIN_EMAIL
        value: Prod.dzl971@gmail.com
      - key: DRSX_API_URL
        fromService:
          type: web
          name: danatrap-rsx-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DRSX_SITE_URL
        fromService:
          type: web
          name: danatrap-rsx-site
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: danatrap-rsx-api
    runtime: node
    rootDir: backend/render-api
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: Prod.dzl971@gmail.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MEDIA_LINK_TTL_SECONDS
        value: "31536000"
      - key: MAX_UPLOAD_BYTES
        value: "5368709120"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: DRIVE_PREVIEWS_FOLDER_ID
        sync: false
      - key: DRIVE_IMAGES_FOLDER_ID
        sync: false
      - key: DRIVE_PRIVATE_FOLDER_ID
        sync: false
      - key: FILE_SIGNING_SECRET
        generateValue: true
